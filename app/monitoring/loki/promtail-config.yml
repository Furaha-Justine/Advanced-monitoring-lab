server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse Docker JSON envelope
      - json:
          expressions:
            log: log
            stream: stream
            time: time

      # Parse application JSON payload from the Docker "log" field
      - json:
          source: log
          expressions:
            message: message
            level: level
            trace_id: trace_id
            span_id: span_id
            service: service
            method: method
            path: path
            route: route
            status_code: status_code
            duration_ms: duration_ms

      # Add searchable labels
      - labels:
          level: level
          service: service
          method: method
          route: route
          status_code: status_code

      # Use Docker event timestamp
      - timestamp:
          source: time
          format: RFC3339Nano

      # Show only the parsed message in Loki logs panel
      - output:
          source: message
