server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log

    pipeline_stages:
      # Parse JSON log
      - json:
          expressions:
            message: message
            level: level
            trace_id: trace_id
            span_id: span_id
            timestamp: timestamp
            service: service

      # Add labels
      - labels:
          level: level
          service: service

      # Parse timestamp
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.999Z07:00"

      # Output parsed values
      - output:
          source: message

  # Web service container logs
  - job_name: web-service
    static_configs:
      - targets:
          - localhost
        labels:
          job: web-service
          container: express_app
          __path__: /var/lib/docker/containers/*express_app*/*-json.log

    pipeline_stages:
      # Parse JSON log
      - json:
          expressions:
            message: message
            level: level
            trace_id: trace_id
            span_id: span_id
            timestamp: timestamp
            service: service
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms

      # Add labels from parsed values
      - labels:
          level: level
          service: service
          method: method
          status_code: status_code

      # Parse timestamp
      - timestamp:
          source: timestamp
          format: "2006-01-02T15:04:05.999Z07:00"

      # Output message
      - output:
          source: message
