global:
  resolve_timeout: 5m

route:
  receiver: "default-receiver"
  repeat_interval: 12h
  routes:
    - match:
        severity: "critical"
      receiver: "critical-receiver"
      repeat_interval: 5m
    - match:
        severity: "warning"
      receiver: "warning-receiver"
      repeat_interval: 30m

receivers:
  - name: "default-receiver"

  - name: "critical-receiver"

  - name: "warning-receiver"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
